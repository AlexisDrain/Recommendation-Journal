<!doctype html>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100vw; height: 100vh; overflow: hidden; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif; color: #e8eaf6;
    background: radial-gradient(ellipse 70% 90% at 72% 55%, rgba(159,168,255,0.28), transparent 70%),
                linear-gradient(160deg, #1c2046 0%, #0e1120 70%);
    display: flex; align-items: center; justify-content: center; gap: 6vh;
    padding: 0 7vw;
  }
  .text { flex: 1 1 0; min-width: 0; overflow: hidden; }
  .icon { width: 15vh; height: 15vh; border-radius: 3.6vh; box-shadow: 0 1vh 4vh rgba(0,0,0,.4); }
  h1 { font-size: 11vh; font-weight: 700; line-height: 1.02; margin-top: 4vh; letter-spacing: -0.02em; }
  h1 span { color: #ffc47a; }
  p { font-size: 4.4vh; color: #b9bee0; margin-top: 3vh; line-height: 1.3; max-width: 28em; }
  .phones { flex: 0 0 auto; position: relative; height: 84vh; width: calc(84vh * 0.4615 * 2.1); }
  .phone { position: absolute; height: 84vh; aspect-ratio: 1179 / 2556; border-radius: 5vh; overflow: hidden;
           border: 0.7vh solid #30365c; box-shadow: 0 3vh 8vh rgba(0,0,0,.55); background: #0e1120; }
  .phone img { width: 100%; height: 100%; display: block; }
  .p1 { left: 0; top: 6vh; height: 74vh; transform: rotate(-8deg); }
  .p3 { right: 0; top: 6vh; height: 74vh; transform: rotate(8deg); }
  .p2 { left: 50%; top: 0; transform: translateX(-50%); z-index: 2; }
  /* Search results: shown smaller, so bigger words */
  body.search { padding: 0 6vw; gap: 4vw; }
  body.search h1 { font-size: 10vh; }
  body.search p { font-size: 4.6vh; }
  /* The very wide header: phones run off the bottom edge */
  body.wide .phones { height: 120vh; width: calc(120vh * 0.4615 * 2.1); margin-top: 30vh; }
  body.wide .phone { height: 120vh; border-radius: 7vh; }
  body.wide .p1, body.wide .p3 { height: 106vh; }
  body.wide h1 { font-size: 13vh; }
  body.wide p { font-size: 5.2vh; }
  body.wide .icon { width: 18vh; height: 18vh; border-radius: 4.3vh; }
</style>
<body>
  <div class="text">
    <img class="icon" src="out/icon.png">
    <h1>Recommendation<br><span>Journal</span></h1>
    <p>Remember what people recommend to you, who told you, and why.</p>
  </div>
  <div class="phones">
    <div class="phone p1"><img src="out/plain/x-fiction.png"></div>
    <div class="phone p3"><img src="out/plain/05-priority.png"></div>
    <div class="phone p2"><img src="out/plain/06-movies.png"></div>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    if (q.get('kind')) document.body.classList.add(q.get('kind'));
    if (q.get('wide')) document.body.classList.add('wide');
    // "Recommendation" is a long word: shrink the title until it fits its side, with room to spare.
    const h1 = document.querySelector('h1'), text = document.querySelector('.text');
    const room = text.clientWidth * 0.96;
    if (h1.scrollWidth > room) h1.style.fontSize = parseFloat(getComputedStyle(h1).fontSize) * room / h1.scrollWidth + 'px';
  </script>
</body>
